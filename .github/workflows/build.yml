name: Build Telegram Desktop

on:
  push:
    branches:
      - "**" # runs on all branches after commit

jobs:
  build:
    runs-on: self-hosted

    env:
      TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
      TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}

    steps:
      - name: Update repository
        working-directory: /usr/src/tdesktop
        run: |
          git reset --hard
          git clean -fd
          git pull --rebase

      # Debug build
      - name: Build Debug
        working-directory: /usr/src/tdesktop
        run: |
          docker run --rm -u $(id -u) \
            -v "/usr/src/tdesktop:/usr/src/tdesktop" \
            -e CONFIG=Debug \
            tdesktop:centos_env \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
            -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH}

      # Release build
      - name: Build Release
        working-directory: /usr/src/tdesktop
        run: |
          docker run --rm -u $(id -u) \
            -v "/usr/src/tdesktop:/usr/src/tdesktop" \
            tdesktop:centos_env \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID=${TDESKTOP_API_ID} \
            -D TDESKTOP_API_HASH=${TDESKTOP_API_HASH}

      - name: Strip debug build
        run: strip --strip-unneeded /usr/src/tdesktop/out/Debug/Telegram

      - name: Strip release build
        run: strip --strip-unneeded /usr/src/tdesktop/out/Release/Telegram

      - name: Upload builds
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Telegram Build ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            /usr/src/tdesktop/out/Debug/Telegram
            /usr/src/tdesktop/out/Release/Telegram
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}